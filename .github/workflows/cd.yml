name: CD

on:
  workflow_run:
    workflows: [ "CI/CD Pipeline" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}-api
  IMAGE_WEB: ghcr.io/${{ github.repository }}-web

jobs:
  publish:
    name: Publish images
    if: github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      api_digest: ${{ steps.api_image.outputs.digest }}
      web_digest: ${{ steps.web_image.outputs.digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set image tag
        id: release
        run: |
          RELEASE_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "TAG=${RELEASE_SHA::12}" >> $GITHUB_ENV
          echo "tag=${RELEASE_SHA::12}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify CI check status for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verifying that CI passed for commit ${{ github.sha }} before manual release dispatch..."
          gh run list --workflow=ci.yml --commit="${{ github.sha }}" --status=success --json conclusion --jq '.[0].conclusion' | grep -q '^success$' || {
            echo "::error::Manual release dispatch requires a successful CI run for commit ${{ github.sha }}"
            exit 1
          }

      - name: Build API image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_API }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_WEB }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_API }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-api.sarif

      - name: Trivy scan Web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_WEB }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-web.sarif

      - name: Push verified API image
        id: api_image
        run: |
          docker push ${{ env.IMAGE_API }}:${{ env.TAG }}
          API_DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "${{ env.IMAGE_API }}:${{ env.TAG }}" | grep "${{ env.IMAGE_API }}@" | head -n 1 | cut -d'@' -f2)
          if [ -z "${API_DIGEST}" ]; then
            API_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ env.IMAGE_API }}:${{ env.TAG }}" | cut -d'@' -f2)
          fi
          echo "digest=${API_DIGEST}" >> $GITHUB_OUTPUT

      - name: Push verified Web image
        id: web_image
        run: |
          docker push ${{ env.IMAGE_WEB }}:${{ env.TAG }}
          WEB_DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "${{ env.IMAGE_WEB }}:${{ env.TAG }}" | grep "${{ env.IMAGE_WEB }}@" | head -n 1 | cut -d'@' -f2)
          if [ -z "${WEB_DIGEST}" ]; then
            WEB_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ env.IMAGE_WEB }}:${{ env.TAG }}" | cut -d'@' -f2)
          fi
          echo "digest=${WEB_DIGEST}" >> $GITHUB_OUTPUT

  release-evidence:
    name: Validate release and publish evidence
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate image digests
        run: |
          API_DIGEST="${{ needs.publish.outputs.api_digest }}"
          WEB_DIGEST="${{ needs.publish.outputs.web_digest }}"
          echo "Validating API digest: ${API_DIGEST}"
          echo "Validating Web digest: ${WEB_DIGEST}"
          echo "${API_DIGEST}" | grep -Eq '^sha256:[a-f0-9]{64}$' || {
            echo "::error::Invalid or missing API digest: ${API_DIGEST}"
            exit 1
          }
          echo "${WEB_DIGEST}" | grep -Eq '^sha256:[a-f0-9]{64}$' || {
            echo "::error::Invalid or missing Web digest: ${WEB_DIGEST}"
            exit 1
          }

      - name: Validate prod compose
        run: |
          DATABASE_URL=postgres://ci_user:ci_password@db.example.net:5432/app?sslmode=require \
          DB_DIRECT_URL=postgres://migration_user:ci_password@db.example.net:5432/app?sslmode=require \
          REDIS_URL=rediss://redis.example.net:6380 \
          JWT_SECRET=ci-production-access-secret-32-characters \
          JWT_REFRESH_SECRET=ci-production-refresh-secret-32chars \
          CLIENT_URL=https://app.example.test \
          API_URL=https://app.example.test \
          VITE_API_URL=https://app.example.test/api/v1 \
          S3_ENDPOINT=https://storage.example.test \
          S3_ACCESS_KEY_ID=ci-storage-key \
          S3_SECRET_ACCESS_KEY=ci-storage-secret \
          EMAIL_FROM=ci@app.example.test \
          METRICS_TOKEN=ci-metrics-token-32-characters-long \
          OTEL_EXPORTER_OTLP_ENDPOINT=https://otel.example.test/v1/traces \
          API_IMAGE_REF=${{ env.IMAGE_API }}@${{ needs.publish.outputs.api_digest }} \
          WEB_IMAGE_REF=${{ env.IMAGE_WEB }}@${{ needs.publish.outputs.web_digest }} \
          PGBOUNCER_DB_HOST=db.example.net \
          PGBOUNCER_DB_NAME=app \
          PGBOUNCER_DB_USER=ci_user \
          PGBOUNCER_DB_PASSWORD=ci-password-32-characters-long \
          docker compose -f docker/docker-compose.prod.yml config

      - name: Validate prod compose with pooling profile
        run: |
          DATABASE_URL=postgres://ci_user:ci_password@db.example.net:5432/app?sslmode=require \
          DB_DIRECT_URL=postgres://migration_user:ci_password@db.example.net:5432/app?sslmode=require \
          REDIS_URL=rediss://redis.example.net:6380 \
          JWT_SECRET=ci-production-access-secret-32-characters \
          JWT_REFRESH_SECRET=ci-production-refresh-secret-32chars \
          CLIENT_URL=https://app.example.test \
          API_URL=https://app.example.test \
          VITE_API_URL=https://app.example.test/api/v1 \
          S3_ENDPOINT=https://storage.example.test \
          S3_ACCESS_KEY_ID=ci-storage-key \
          S3_SECRET_ACCESS_KEY=ci-storage-secret \
          EMAIL_FROM=ci@app.example.test \
          METRICS_TOKEN=ci-metrics-token-32-characters-long \
          OTEL_EXPORTER_OTLP_ENDPOINT=https://otel.example.test/v1/traces \
          API_IMAGE_REF=${{ env.IMAGE_API }}@${{ needs.publish.outputs.api_digest }} \
          WEB_IMAGE_REF=${{ env.IMAGE_WEB }}@${{ needs.publish.outputs.web_digest }} \
          PGBOUNCER_DB_HOST=db.example.net \
          PGBOUNCER_DB_NAME=app \
          PGBOUNCER_DB_USER=ci_user \
          PGBOUNCER_DB_PASSWORD=ci-password-32-characters-long \
          docker compose -f docker/docker-compose.prod.yml --profile pooling config

      - name: Validate staging compose
        run: |
          docker compose -f docker/docker-compose.staging.yml --env-file docker/.env.staging.example config

      - name: Write immutable release manifest
        run: |
          RELEASE_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          cat > release-manifest.json <<EOF
          {
            "commit": "${RELEASE_SHA}",
            "tag": "${RELEASE_SHA::12}",
            "api": "${IMAGE_API}@${{ needs.publish.outputs.api_digest }}",
            "web": "${IMAGE_WEB}@${{ needs.publish.outputs.web_digest }}"
          }
          EOF
          cat release-manifest.json

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.publish.outputs.tag }}
          path: release-manifest.json
          retention-days: 90
