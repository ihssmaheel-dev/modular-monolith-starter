name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}-api
  IMAGE_WEB: ghcr.io/${{ github.repository }}-web

jobs:
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::12}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_API }}:${{ env.TAG }},${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_WEB }}:${{ env.TAG }},${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_API }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-api.sarif

      - name: Trivy scan Web image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_WEB }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-web.sarif

  migrate-and-deploy:
    name: Migrate and deploy (example)
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate prod compose
        run: |
          DATABASE_URL=postgres://ci_user:ci_password@db.example.net:5432/app?sslmode=require \
          REDIS_URL=rediss://redis.example.net:6380 \
          JWT_SECRET=ci-production-access-secret-32-characters \
          JWT_REFRESH_SECRET=ci-production-refresh-secret-32chars \
          CLIENT_URL=https://app.example.test \
          API_URL=https://app.example.test \
          VITE_API_URL=https://app.example.test/api/v1 \
          S3_ENDPOINT=https://storage.example.test \
          S3_ACCESS_KEY_ID=ci-storage-key \
          S3_SECRET_ACCESS_KEY=ci-storage-secret \
          EMAIL_FROM=ci@app.example.test \
          METRICS_TOKEN=ci-metrics-token-32-characters-long \
          PGBOUNCER_DB_HOST=db.example.net \
          PGBOUNCER_DB_NAME=app \
          PGBOUNCER_DB_USER=ci_user \
          PGBOUNCER_DB_PASSWORD=ci-password-32-characters-long \
          docker compose -f docker/docker-compose.prod.yml config

      - name: Validate prod compose with pooling profile
        run: |
          DATABASE_URL=postgres://ci_user:ci_password@db.example.net:5432/app?sslmode=require \
          REDIS_URL=rediss://redis.example.net:6380 \
          JWT_SECRET=ci-production-access-secret-32-characters \
          JWT_REFRESH_SECRET=ci-production-refresh-secret-32chars \
          CLIENT_URL=https://app.example.test \
          API_URL=https://app.example.test \
          VITE_API_URL=https://app.example.test/api/v1 \
          S3_ENDPOINT=https://storage.example.test \
          S3_ACCESS_KEY_ID=ci-storage-key \
          S3_SECRET_ACCESS_KEY=ci-storage-secret \
          EMAIL_FROM=ci@app.example.test \
          METRICS_TOKEN=ci-metrics-token-32-characters-long \
          PGBOUNCER_DB_HOST=db.example.net \
          PGBOUNCER_DB_NAME=app \
          PGBOUNCER_DB_USER=ci_user \
          PGBOUNCER_DB_PASSWORD=ci-password-32-characters-long \
          docker compose -f docker/docker-compose.prod.yml --profile pooling config

      - name: Validate staging compose
        run: |
          docker compose -f docker/docker-compose.staging.yml --env-file docker/.env.staging.example config

      - name: Deploy instructions
        run: |
          echo "Images published with tag ${GITHUB_SHA::12}."
          echo "Deploy on your host with:"
          echo "  TAG=${GITHUB_SHA::12} docker compose -f docker/docker-compose.prod.yml up -d --wait"
          echo "Migrations run via the 'migrate' service with service_completed_successfully gate."
          echo "Verify health: GET /api/v1/health/live (api) and GET / (web)."
