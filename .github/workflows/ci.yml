name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      REDIS_URL: redis://localhost:6379
      E2E_USE_CONTAINERS: "true"
      JWT_SECRET: super-secret-test-access-token-key-32chars
      JWT_REFRESH_SECRET: super-secret-test-refresh-token-key-32chars
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: uploads
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.34.5
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture Rules Check
        run: pnpm run rules:check

      - name: Generator Smoke Test
        run: pnpm run test:generator

      - name: Formatting Check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Unit Tests
        run: pnpm test:unit

      - name: Contract and migration checks (fresh + upgrade)
        run: |
          pnpm --filter @repo/contracts build
          pnpm db:migrate:check
          pnpm db:migrate
          pnpm db:migrate:status

      - name: Backup and restore verification
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client
          psql "postgres://postgres:postgres@localhost:5432/postgres" \
            --set ON_ERROR_STOP=1 -c "CREATE DATABASE restore_verify"
          BACKUP_DIR="/tmp/architecture-backups"
          pnpm db:backup "$BACKUP_DIR"
          BACKUP_FILE="$(find "$BACKUP_DIR" -name 'pg_backup_*.sql.gz' -print -quit)"
          RESTORE_VERIFY_DATABASE_URL="postgres://postgres:postgres@localhost:5432/restore_verify" \
          RESTORE_VERIFY_ALLOW_RESET=true \
          pnpm db:restore:verify "$BACKUP_FILE"

      - name: Integration Tests
        run: pnpm test:integration

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: End-to-End Tests
        run: pnpm test:e2e

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Build
        run: pnpm run build

      - name: Production compose validation
        run: |
          DATABASE_URL=postgres://ci_user:ci_password@db.example.net:5432/app?sslmode=require \
          REDIS_URL=rediss://redis.example.net:6380 \
          JWT_SECRET=ci-production-access-secret-32-characters \
          JWT_REFRESH_SECRET=ci-production-refresh-secret-32chars \
          CLIENT_URL=https://app.example.test \
          API_URL=https://api.example.test \
          VITE_API_URL=https://api.example.test/api/v1 \
          S3_ENDPOINT=https://storage.example.test \
          S3_ACCESS_KEY_ID=ci-storage-key \
          S3_SECRET_ACCESS_KEY=ci-storage-secret \
          EMAIL_FROM=ci@app.example.test \
          METRICS_TOKEN=ci-metrics-token-32-characters-long \
          docker compose -f docker/docker-compose.prod.yml config

      - name: Build production API image
        run: docker build --file Dockerfile --tag modular-monolith-api:ci .

      - name: Build production web image
        run: docker build --file apps/web/Dockerfile --build-arg VITE_API_URL=http://localhost:5156/api/v1 --tag modular-monolith-web:ci .

      - name: Build Storybook catalog
        run: pnpm turbo build-storybook --filter=@repo/ui
