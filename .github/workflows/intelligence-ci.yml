name: Intelligence Service CI

on:
  push:
    branches:
      - main
      - feat/intelligence
    paths:
      - "services/intelligence/**"
      - "docker/docker-compose.intelligence.yml"
      - ".github/workflows/intelligence-ci.yml"
  pull_request:
    paths:
      - "services/intelligence/**"
      - "docker/docker-compose.intelligence.yml"
      - ".github/workflows/intelligence-ci.yml"

jobs:
  lint-and-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/intelligence

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff formatter check
        run: uv run ruff format --check .

      - name: Verify Granian CLI flags
        run: uv run granian --help

      - name: Run Pytest test suite
        run: uv run pytest -v
