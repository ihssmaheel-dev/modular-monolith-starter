name: Build disposable S3 fixture
description: Official pinned source with shared immutable fixture build layers
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: docker/fixtures/minio
        load: true
        tags: starter-minio-fixture:ci
        cache-from: type=gha,scope=minio-fixture
        cache-to: type=gha,scope=minio-fixture,mode=max
