global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

# Prod alert routing: run Alertmanager with alertmanager.example.yml
# (SLACK_WEBHOOK_URL) and uncomment:
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api-service"
    metrics_path: "/metrics"
    bearer_token: "optional-development-metrics-token-32chars"
    static_configs:
      - targets: ["host.docker.internal:5156"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
