groups:
  - name: service-availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service target {{ $labels.job }} ({{ $labels.instance }}) is down"
          description: "Target has been unreachable for more than 2 minutes."

  - name: api-service-health
    rules:
      - alert: ApiHighErrorRate
        expr: (sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m]))) * 100 > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: API HTTP 5xx error rate is elevated
          description: "HTTP 5xx error rate is above 2% over the last 5 minutes."

      - alert: ApiHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency exceeds 1 second
          description: "95th percentile latency is above 1s over the last 5 minutes."

  - name: modular-monolith-reliability
    rules:
      - alert: OutboxPendingDepthHigh
        expr: outbox_pending_events_depth > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Outbox queue depth is high
          description: More than 1000 outbox events have been pending for at least 10 minutes.

      - alert: OutboxEventLagHigh
        expr: outbox_pending_age_ms > 300000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Outbox events are delayed
          description: The oldest pending outbox event is older than five minutes.

      - alert: OutboxDeadLettersCreated
        expr: increase(outbox_dead_letter_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Outbox events were dead-lettered
          description: One or more outbox events exceeded their retry budget in the last 10 minutes.

      - alert: OutboxRetryRateHigh
        expr: increase(outbox_retry_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Outbox delivery retries are elevated
          description: More than ten outbox retries occurred during a rolling 10-minute window.

      - alert: FileReconciliationErrors
        expr: increase(file_reconciliation_error_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: File reconciliation encountered storage errors
          description: The file reconciler could not verify one or more objects in the last 15 minutes.

      - alert: FileReconciliationRepairs
        expr: increase(file_reconciliation_repaired_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: File metadata drift was repaired
          description: One or more uploaded files were marked failed after object verification.

      - alert: QueueStalledJobs
        expr: (increase(bullmq_stalled_jobs_total[10m]) > 0) or (increase(bullmq_job_failures_total[10m]) > 5)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: BullMQ background queue jobs are stalled or failing
          description: One or more jobs stalled or failed repeatedly in the background queue worker.

      - alert: WorkerSilentDeath
        expr: worker_heartbeats_active == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: No active worker heartbeats detected
          description: Worker heartbeat keys are missing or expired in Redis for over 3 minutes.

  - name: database-and-cache-health
    rules:
      - alert: PostgresBufferHitRatioLow
        expr: ((sum(rate(pg_stat_database_blks_hit[5m])) / (sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m])))) * 100 < 95) and ((sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m]))) > 0.1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL buffer cache hit ratio is low
          description: "Postgres buffer hit ratio dropped below 95% over the last 10 minutes."

      - alert: PostgresDatabaseSizeHigh
        expr: pg_database_size_bytes{datname="app"} > 10737418240
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL application database size is high
          description: "Database 'app' size has exceeded 10GB."

      - alert: RedisKeyspaceHitRatioLow
        expr: ((rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]))) * 100 < 40) and ((rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) > 0.1)
        for: 15m
        labels:
          severity: info
        annotations:
          summary: Redis keyspace hit ratio is low
          description: "Redis cache hit ratio has dropped below 60% over the last 15 minutes."

  - name: container-health
    rules:
      - alert: ContainerOomKilled
        expr: increase(container_oom_events_total{name=~"monorepo-.*"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Container was OOM killed by the kernel
          description: "One or more monorepo containers experienced an Out-Of-Memory termination event."

      - alert: ContainerHighMemoryUsage
        expr: (container_memory_working_set_bytes{name=~"monorepo-.*"} / container_spec_memory_limit_bytes{name=~"monorepo-.*"} > 0.85) and (container_spec_memory_limit_bytes{name=~"monorepo-.*"} > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Container working set memory is dangerously high
          description: "Container working set memory exceeded 85% of its configured limit for over 5 minutes."

      - alert: ContainerHighCpuUsage
        expr: (sum by (name) (rate(container_cpu_usage_seconds_total{name=~"monorepo-.*"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Container CPU utilization is sustained above 85%
          description: "Container is consuming more than 85% CPU capacity for over 5 minutes."

