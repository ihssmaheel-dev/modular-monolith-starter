groups:
  - name: service-availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service target {{ $labels.job }} ({{ $labels.instance }}) is down"
          description: "Target has been unreachable for more than 2 minutes."

  - name: api-service-health
    rules:
      - alert: ApiHighErrorRate
        expr: (sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m]))) * 100 > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: API HTTP 5xx error rate is elevated
          description: "HTTP 5xx error rate is above 2% over the last 5 minutes."

      - alert: ApiHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency exceeds 1 second
          description: "95th percentile latency is above 1s over the last 5 minutes."

  - name: modular-monolith-reliability
    rules:
      - alert: OutboxPendingDepthHigh
        expr: outbox_pending_events_depth > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Outbox queue depth is high
          description: More than 1000 outbox events have been pending for at least 10 minutes.

      - alert: OutboxEventLagHigh
        expr: outbox_pending_age_ms > 300000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Outbox events are delayed
          description: The oldest pending outbox event is older than five minutes.

      - alert: OutboxDeadLettersCreated
        expr: increase(outbox_dead_letter_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Outbox events were dead-lettered
          description: One or more outbox events exceeded their retry budget in the last 10 minutes.

      - alert: OutboxRetryRateHigh
        expr: increase(outbox_retry_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Outbox delivery retries are elevated
          description: More than ten outbox retries occurred during a rolling 10-minute window.

      - alert: FileReconciliationErrors
        expr: increase(file_reconciliation_error_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: File reconciliation encountered storage errors
          description: The file reconciler could not verify one or more objects in the last 15 minutes.

      - alert: FileReconciliationRepairs
        expr: increase(file_reconciliation_repaired_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: File metadata drift was repaired
          description: One or more uploaded files were marked failed after object verification.

      - alert: QueueStalledJobs
        expr: (increase(bullmq_stalled_jobs_total[10m]) > 0) or (increase(bullmq_job_failures_total[10m]) > 5)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: BullMQ background queue jobs are stalled or failing
          description: One or more jobs stalled or failed repeatedly in the background queue worker.

      - alert: WorkerSilentDeath
        expr: absent(up{job="worker-service"}) or up{job="worker-service"} == 0 or (time() - worker_heartbeat_timestamp_seconds > 60)
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: No active worker heartbeats detected
          description: Worker metrics are unreachable or the process heartbeat has stopped for over 3 minutes.

      - alert: NotificationDeliveryBacklog
        expr: notification_delivery_pending_depth > 1000 or notification_delivery_oldest_pending_age_seconds > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Notification delivery backlog is growing
          description: Notification delivery depth or oldest-item age exceeded the operating budget.

      - alert: NotificationDeliveryDeadLetters
        expr: notification_delivery_dead_depth > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Notification delivery intents exhausted their retries
          description: At least one email or push delivery requires an operator decision.

      - alert: PrivacyExportBacklog
        expr: privacy_export_pending_depth > 100 or privacy_export_oldest_pending_age_seconds > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Privacy export backlog is outside its operating budget
          description: Export depth exceeds 100 or the oldest request has waited over 15 minutes.

      - alert: PrivacyExportFailures
        expr: privacy_export_failed_depth > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Privacy exports exhausted their retries
          description: At least one privacy export needs an operator decision.

  - name: database-and-cache-health
    rules:
      - alert: PostgresBufferHitRatioLow
        expr: ((sum(rate(pg_stat_database_blks_hit[5m])) / (sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m])))) * 100 < 95) and ((sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m]))) > 0.1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL buffer cache hit ratio is low
          description: "Postgres buffer hit ratio dropped below 95% over the last 10 minutes."

      - alert: PostgresDatabaseSizeHigh
        expr: sum by (datname) (pg_database_size_bytes) > 10737418240
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL database size is high
          description: "A PostgreSQL database has exceeded 10GB; review growth and storage capacity."

      - alert: PostgresConnectionsNearLimit
        expr: (sum(pg_stat_activity_count) / max(pg_settings_max_connections)) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL connections are nearing the configured limit
          description: "PostgreSQL active connections are above 80% of max_connections."

      - alert: RedisMemoryPressure
        expr: redis_memory_max_bytes > 0 and (redis_memory_used_bytes / redis_memory_max_bytes) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Redis memory usage is high
          description: "Redis memory usage is above 80% of its configured maxmemory."

      - alert: RedisEvictionsDetected
        expr: increase(redis_evicted_keys_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Redis is evicting keys
          description: "Redis evicted one or more keys during the last 10 minutes."

      - alert: RedisKeyspaceHitRatioLow
        expr: ((rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]))) * 100 < 40) and ((rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) > 0.1)
        for: 15m
        labels:
          severity: info
        annotations:
          summary: Redis keyspace hit ratio is low
          description: "Redis cache hit ratio has dropped below 40% over the last 15 minutes."

  - name: container-health
    rules:
      - alert: ContainerOomKilled
        expr: increase(container_oom_events_total{name=~"monorepo-.*"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Container was OOM killed by the kernel
          description: "One or more monorepo containers experienced an Out-Of-Memory termination event."

      - alert: ContainerHighMemoryUsage
        expr: (container_memory_working_set_bytes{name=~"monorepo-.*"} / container_spec_memory_limit_bytes{name=~"monorepo-.*"} > 0.85) and (container_spec_memory_limit_bytes{name=~"monorepo-.*"} > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Container working set memory is dangerously high
          description: "Container working set memory exceeded 85% of its configured limit for over 5 minutes."

      - alert: ContainerHighCpuUsage
        expr: (sum by (name) (rate(container_cpu_usage_seconds_total{name=~"monorepo-.*"}[5m])) / on (name) (container_spec_cpu_quota{name=~"monorepo-.*"} / container_spec_cpu_period{name=~"monorepo-.*"})) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Container CPU utilization is sustained above 85%
          description: "Container is consuming more than 85% CPU capacity for over 5 minutes."

  - name: async-and-provider-health
    rules:
      - alert: BullMQQueueBacklogHigh
        expr: bullmq_queue_waiting_jobs > 1000 or bullmq_queue_oldest_waiting_age_seconds > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: BullMQ queue backlog is outside its operating budget
          description: "A queue has more than 1000 waiting jobs or an oldest job older than five minutes."

      - alert: RealtimeConsumerLagHigh
        expr: realtime_consumer_lag_ms > 300000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Realtime consumer lag is high
          description: "A realtime consumer has been more than five minutes behind the stream."

      - alert: RealtimeDeadLettersCreated
        expr: increase(realtime_dead_letter_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Realtime events were dead-lettered
          description: "One or more realtime events could not be delivered within their retry budget."

      - alert: EmailCircuitBreakerOpen
        expr: circuit_breaker_state{name="email"} == 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Email provider circuit breaker is open
          description: "Email delivery is being rejected while the provider circuit is open."

  - name: telemetry-pipeline-health
    rules:
      - alert: TelemetryActiveSeriesHigh
        expr: prometheus_tsdb_head_series > 100000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Prometheus active-series count is above the starter budget
          description: "More than 100,000 active series can increase memory, disk, and managed-metrics cost."

      - alert: LokiIngestionRateHigh
        expr: sum(rate(loki_distributor_bytes_received_total[5m])) > 131072
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Loki log ingestion is above the starter budget
          description: "Sustained log ingestion is above 128 KiB/s; identify noisy services before storage grows."

      - alert: ErrorReportsDropped
        expr: increase(error_reports_dropped_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Error reports were dropped by the intake bulkhead
          description: "The application protected itself from an error-reporting storm; use logs and traces to investigate the underlying failures."

  - name: object-storage-health
    rules:
      - alert: StorageHighErrorRate
        expr: (sum(rate(storage_errors_total[5m])) / (sum(rate(storage_operations_total[5m])) > 0)) * 100 > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Object storage error rate is elevated
          description: "Storage operations error rate is above 2% over the last 5 minutes. See RB-09."

      - alert: StorageHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(storage_operation_duration_seconds_bucket[5m])) by (le)) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Object storage p95 latency exceeds 2 seconds
          description: "Storage operation 95th percentile latency is above 2 seconds over the last 5 minutes. See RB-09."

      - alert: StorageCircuitBreakerOpen
        expr: circuit_breaker_state{name="storage"} == 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Storage circuit breaker is open
          description: "Object storage circuit breaker has tripped open; operations are failing fast. See RB-09."

  - name: minio-infrastructure-health
    rules:
      - alert: MinioNodeDown
        expr: (up{job="minio"} == 0) and on() (count(minio_cluster_capacity_usable_total_bytes) > 0 or count_over_time(up{job="minio"}[1h]) > 0)
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: MinIO storage node is unreachable
          description: "A previously active MinIO cluster target has been down for over 3 minutes. See RB-20."

      - alert: MinioDiskOffline
        expr: minio_cluster_drives_offline_total > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: MinIO cluster drives are offline
          description: "One or more physical storage disks in the MinIO cluster are offline. See RB-20."

      - alert: MinioDiskSpaceCritical
        expr: (minio_cluster_capacity_usable_free_bytes / (minio_cluster_capacity_usable_total_bytes > 0)) < 0.15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: MinIO storage capacity is critically low
          description: "Usable free storage capacity in the MinIO cluster is below 15%. See RB-20."
