# Production runs against externally managed TLS-enabled PostgreSQL, Redis, and S3.
# Use docker/docker-compose.yml for local plaintext development dependencies.
services:
  nginx:
    image: nginx:1.27.4-alpine
    container_name: monorepo-nginx
    labels:
      observability.logs: "true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx-insecure.conf:/etc/nginx/templates/insecure.conf.template:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx-entrypoint.sh:/docker-entrypoint.d/99-tls-check.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.d/99-tls-check.sh"]
    environment:
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - app-network

  web:
    image: ${WEB_IMAGE_REF:?set WEB_IMAGE_REF to an immutable image digest}
    labels:
      observability.logs: "true"
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging: *bounded-logging
    networks:
      - app-network

  api:
    image: ${API_IMAGE_REF:?set API_IMAGE_REF to an immutable image digest}
    labels:
      observability.logs: "true"
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PROCESS_ROLE: api
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_NAME: ${APP_NAME:-Workspace}
      APP_SLUG: ${APP_SLUG:-modular-monolith}
      EXAMPLE_FEATURES_ENABLED: ${EXAMPLE_FEATURES_ENABLED:-false}
      TENANCY_MODE: ${TENANCY_MODE:-single}
      PORT: 3000
      TRUST_PROXY: "true"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-modular-monolith-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-modular-monolith-client}
      JWT_SIGNING_KEYS: ${JWT_SIGNING_KEYS:-}
      JWT_REFRESH_SIGNING_KEYS: ${JWT_REFRESH_SIGNING_KEYS:-}
      JWT_ACTIVE_KEY_ID: ${JWT_ACTIVE_KEY_ID:-primary}
      JWT_REFRESH_ACTIVE_KEY_ID: ${JWT_REFRESH_ACTIVE_KEY_ID:-primary}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?set OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9464}
      CLIENT_URL: ${CLIENT_URL:?set CLIENT_URL}
      API_URL: ${API_URL:?set API_URL}
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      INVITATION_RETENTION_DAYS: ${INVITATION_RETENTION_DAYS:-90}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      FILE_USER_QUOTA_BYTES: ${FILE_USER_QUOTA_BYTES:-104857600}
      FILE_TENANT_QUOTA_BYTES: ${FILE_TENANT_QUOTA_BYTES:-10737418240}
      FILE_TENANT_MAX_OBJECTS: ${FILE_TENANT_MAX_OBJECTS:-100000}
      FILE_AV_ENABLED: ${FILE_AV_ENABLED:-false}
      FILE_AV_URL: ${FILE_AV_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 250
    logging: *bounded-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  worker:
    image: ${API_IMAGE_REF:?set API_IMAGE_REF to an immutable image digest}
    labels:
      observability.logs: "true"
    command: ["node", "apps/api/dist/apps/api/src/main.js"]
    environment:
      NODE_ENV: production
      PROCESS_ROLE: worker
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      APP_NAME: ${APP_NAME:-Workspace}
      APP_SLUG: ${APP_SLUG:-modular-monolith}
      EXAMPLE_FEATURES_ENABLED: ${EXAMPLE_FEATURES_ENABLED:-false}
      TENANCY_MODE: ${TENANCY_MODE:-single}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-modular-monolith-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-modular-monolith-client}
      JWT_SIGNING_KEYS: ${JWT_SIGNING_KEYS:-}
      JWT_REFRESH_SIGNING_KEYS: ${JWT_REFRESH_SIGNING_KEYS:-}
      JWT_ACTIVE_KEY_ID: ${JWT_ACTIVE_KEY_ID:-primary}
      JWT_REFRESH_ACTIVE_KEY_ID: ${JWT_REFRESH_ACTIVE_KEY_ID:-primary}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?set OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9464}
      CLIENT_URL: ${CLIENT_URL:?set CLIENT_URL}
      API_URL: ${API_URL:?set API_URL}
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      INVITATION_RETENTION_DAYS: ${INVITATION_RETENTION_DAYS:-90}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      FILE_USER_QUOTA_BYTES: ${FILE_USER_QUOTA_BYTES:-104857600}
      FILE_TENANT_QUOTA_BYTES: ${FILE_TENANT_QUOTA_BYTES:-10737418240}
      FILE_TENANT_MAX_OBJECTS: ${FILE_TENANT_MAX_OBJECTS:-100000}
      FILE_AV_ENABLED: ${FILE_AV_ENABLED:-false}
      FILE_AV_URL: ${FILE_AV_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "9464"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:9464/health/ready || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 250
    logging: *bounded-logging
    networks:
      - app-network

  # Optional connection pooling. Enable with `--profile pooling` and point the
  # app/worker DATABASE_URL at the pooler; keep migrate/seed on DB_DIRECT_URL
  # (advisory locks need direct connections). See docs/DATABASE.md.
  pgbouncer:
    image: pgbouncer/pgbouncer:1.25.2
    container_name: monorepo-pgbouncer
    profiles: [pooling]
    environment:
      PGBOUNCER_DB_HOST: ${PGBOUNCER_DB_HOST:-}
      PGBOUNCER_DB_PORT: ${PGBOUNCER_DB_PORT:-5432}
      PGBOUNCER_DB_NAME: ${PGBOUNCER_DB_NAME:-}
      PGBOUNCER_DB_USER: ${PGBOUNCER_DB_USER:-}
      PGBOUNCER_DB_PASSWORD: ${PGBOUNCER_DB_PASSWORD:-}
      PGBOUNCER_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-25}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      PGBOUNCER_MAX_PREPARED_STATEMENTS: ${PGBOUNCER_MAX_PREPARED_STATEMENTS:-100}
    volumes:
      - ./pgbouncer-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    expose:
      - "6432"
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    logging: *bounded-logging

  migrate:
    image: ${API_IMAGE_REF:?set API_IMAGE_REF to an immutable image digest}
    command: ["node", "apps/api/dist/apps/api/src/infrastructure/database/migrate.js"]
    environment:
      DATABASE_URL: ${DB_DIRECT_URL:?set DB_DIRECT_URL for the migration role/direct connection}
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging: *bounded-logging
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
