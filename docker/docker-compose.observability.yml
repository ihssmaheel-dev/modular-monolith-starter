x-observability-logging: &observability-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: monorepo-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=10GB"
      - "--enable-feature=exemplar-storage"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging: *observability-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.3.2
    container_name: monorepo-loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    logging: *observability-logging

  alloy:
    image: grafana/alloy:v1.7.1
    container_name: monorepo-alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 150
    logging: *observability-logging

  tempo:
    image: grafana/tempo:2.7.1
    container_name: monorepo-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging: *observability-logging

  grafana:
    image: grafana/grafana:11.5.2
    container_name: monorepo-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging: *observability-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: monorepo-postgres-exporter
    ports:
      - "127.0.0.1:9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/app?sslmode=disable"
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    logging: *observability-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: monorepo-redis-exporter
    ports:
      - "127.0.0.1:9121:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    logging: *observability-logging

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: monorepo-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    logging: *observability-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: monorepo-cadvisor
    ports:
      - "127.0.0.1:${CADVISOR_HOST_PORT:-8081}:8080"
    command:
      - "--docker_only=true"
      - "--disable_metrics=disk,diskIO"
      - "--housekeeping_interval=10s"
      - "--max_housekeeping_interval=15s"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    privileged: true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 150
    logging: *observability-logging

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  alertmanager_data:
  tempo_data:
  alloy_data:
