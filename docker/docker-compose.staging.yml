# Staging mirrors production shape (nginx + web + api + worker, migrate gate)
# against self-hosted dependencies (Postgres, Redis, MinIO, Mailpit).
#
# Differences from prod, all deliberate:
# - Host ports are shifted so staging runs side by side with dev (see header).
# - No TLS: nginx-entrypoint.sh degrades to plain HTTP when certs are absent.
# - Mailpit replaces real SMTP so no test email ever leaves the machine.
# - Data volumes are staging-* (never shared with dev).
#
# Host port map (dev port -> staging port):
#   nginx 80/443 -> 8080/8443 | postgres 5432 -> 5433 | redis 6379 -> 6380
#   minio 9000/9001 -> 9002/9003 | mailpit 1025/8025 -> 1026/8026
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: monorepo-staging-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx-entrypoint.sh:/docker-entrypoint.d/99-tls-check.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.d/99-tls-check.sh"]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL}
        VITE_APP_NAME: ${VITE_APP_NAME:-Workspace}
    container_name: monorepo-staging-web
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: monorepo-staging-api
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PROCESS_ROLE: api
      TENANCY_MODE: ${TENANCY_MODE:-single}
      PORT: 3000
      TRUST_PROXY: "true"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_SIGNING_KEYS: ${JWT_SIGNING_KEYS:-}
      JWT_REFRESH_SIGNING_KEYS: ${JWT_REFRESH_SIGNING_KEYS:-}
      JWT_ACTIVE_KEY_ID: ${JWT_ACTIVE_KEY_ID:-primary}
      JWT_REFRESH_ACTIVE_KEY_ID: ${JWT_REFRESH_ACTIVE_KEY_ID:-primary}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      CLIENT_URL: ${CLIENT_URL:?set CLIENT_URL}
      API_URL: ${API_URL:?set API_URL}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      INVITATION_RETENTION_DAYS: ${INVITATION_RETENTION_DAYS:-90}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      FILE_USER_QUOTA_BYTES: ${FILE_USER_QUOTA_BYTES:-104857600}
      FILE_AV_ENABLED: ${FILE_AV_ENABLED:-false}
      FILE_AV_URL: ${FILE_AV_URL:-}
      CDN_ENABLED: ${CDN_ENABLED:-false}
      CDN_DOMAIN: ${CDN_DOMAIN:-}
      CDN_BUCKET_PATH: ${CDN_BUCKET_PATH:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: monorepo-staging-worker
    command: ["node", "apps/api/dist/apps/api/src/main.js"]
    environment:
      NODE_ENV: production
      PROCESS_ROLE: worker
      TENANCY_MODE: ${TENANCY_MODE:-single}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_SIGNING_KEYS: ${JWT_SIGNING_KEYS:-}
      JWT_REFRESH_SIGNING_KEYS: ${JWT_REFRESH_SIGNING_KEYS:-}
      JWT_ACTIVE_KEY_ID: ${JWT_ACTIVE_KEY_ID:-primary}
      JWT_REFRESH_ACTIVE_KEY_ID: ${JWT_REFRESH_ACTIVE_KEY_ID:-primary}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      CLIENT_URL: ${CLIENT_URL:?set CLIENT_URL}
      API_URL: ${API_URL:?set API_URL}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      INVITATION_RETENTION_DAYS: ${INVITATION_RETENTION_DAYS:-90}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      FILE_USER_QUOTA_BYTES: ${FILE_USER_QUOTA_BYTES:-104857600}
      FILE_AV_ENABLED: ${FILE_AV_ENABLED:-false}
      FILE_AV_URL: ${FILE_AV_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Worker has no HTTP port. Process liveness proves the outbox relay /
    # queue consumers are running. Do not disable this.
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[n]ode.*main.js'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: monorepo-staging-migrate
    command: ["node", "apps/api/dist/apps/api/src/infrastructure/database/migrate.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: monorepo-staging-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: monorepo-staging-redis
    ports:
      - "6380:6379"
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: monorepo-staging-minio
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - staging_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  minio-init:
    image: minio/mc:latest
    container_name: monorepo-staging-minio-init
    entrypoint: /bin/sh
    command:
      - -c
      - mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/uploads
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:v1.30.0
    container_name: monorepo-staging-mailpit
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_minio_data:

networks:
  app-network:
    driver: bridge
